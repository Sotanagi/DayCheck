function decideAnimalType(logs) {
  if (!logs || logs.length === 0) return "turtle";

  const strength = logs.filter(l => l.type === "strength").length;
  const walk = logs.filter(l => l.type === "walk").length;
  const other = logs.filter(l => l.type === "other").length;
  const total = logs.length;
  const variety = new Set(logs.map(l => l.type)).size;

  if (variety >= 3) return "monkey";
  if (strength / total >= 0.8) return "gorilla";
  if (walk / total >= 0.8) return "deer";
  if (strength > 0 && walk > 0) return "bear";
  if (other / total >= 0.7) return "dolphin";
  if (total >= 5) return "eagle";
  if (total >= 3) return "rabbit";

  return "turtle";
}

function getUnlockedAnimals(logs) {
  if (!logs || logs.length === 0) return ["turtle"];

  const unlocked = new Set();

  const strength = logs.filter(l => l.type === "strength").length;
  const walk = logs.filter(l => l.type === "walk").length;
  const other = logs.filter(l => l.type === "other").length;
  const total = logs.length;
  const variety = new Set(logs.map(l => l.type)).size;

  if (total >= 1) unlocked.add("turtle");
  if (total >= 3) unlocked.add("rabbit");
  if (total >= 5) unlocked.add("eagle");

  if (strength >= 1) unlocked.add("wolf");
  if (strength >= 3) unlocked.add("gorilla");
  if (strength >= 5) unlocked.add("buffalo");

  if (walk >= 1) unlocked.add("dog");
  if (walk >= 3) unlocked.add("deer");
  if (walk >= 5) unlocked.add("horse");

  if (other >= 1) unlocked.add("otter");
  if (other >= 3) unlocked.add("dolphin");
  if (other >= 5) unlocked.add("swan");

  if (strength >= 2 && walk >= 2) unlocked.add("bear");
  if (variety >= 3) unlocked.add("monkey");
  if (total >= 10) unlocked.add("cheetah");
  if (total >= 15) unlocked.add("squirrel");

  return Array.from(unlocked);
}

function escapeHTML(text) {

    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'

}

async function loadHistory() {
  const [s,w,o] = await Promise.all([
    db.from('strength_logs').select('*').eq('user_id',userId),
    db.from('walk_logs').select('*').eq('user_id',userId),
    db.from('other_logs').select('*').eq('user_id',userId)

  items.sort((a,b) => new Date(b.logged_at) - new Date(a.logged_at));
  
  const box = document.getElementById('historyFeed');
  box.innerHTML = items.length ? items.map(i => `<div class="feed-item"><div class="fi-name">${i.t}</div><div class="fi-time" style="margin-left:auto;">${i.logged_at.split('T')[0]}</div></div>`).join('') : '<div class="feed-empty">記録なし</div>';
}

// --- Streak 自動計算 & 共有 ---
async function calcStreak() {
  const { data } = await db.from('strength_logs').select('logged_at').eq('user_id',userId).order('logged_at', {ascending:false});
  // 簡易的に件数を表示（本来は日付で連続判定するが、今回はログ件数ベースの簡易版）
  const uniqueDays = new Set((data||[]).map(d => d.logged_at.split('T')[0])).size;
  document.getElementById('streakNum').innerText = uniqueDays + '日';
  document.getElementById('todayChip').innerText = `✅ 累計 ${uniqueDays}日`;
}

async function shareStreakToGroup() {
  const strkText = document.getElementById('streakNum')?.textContent || '0日';
  const streak = parseInt(strkText);

  if (!currentGroupId) return;
  if (!streak || streak <= 0) return;

  await db.from('chat_messages').insert({
    group_id: currentGroupId,
    user_id: userId,
    display_name: displayName || 'ゲスト',
    message: `🎉 今日の記録完了！連続記録: ${strkText} 🔥`,
    message_type: 'streak',
    reactions: {}
  });
}

// --- チャット機能 ---
async function loadChat() {
  const box = document.getElementById('chatBox');
  if (!box) return;

  if (!currentGroupId) {
    box.innerHTML = `<div class="feed-empty">グループを作成または選択してください</div>`;
    return;
  }

  box.innerHTML = `<div class="feed-empty">コメントを読み込み中...</div>`;

  const { data, error } = await db
    .from('chat_messages')
    .select('*')
    .eq('group_id', currentGroupId)
    .order('created_at', { ascending: true });

  if (error) {
    box.innerHTML = `<div class="feed-empty">読み込み失敗<br>${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    box.innerHTML = `<div class="feed-empty">まだコメントはありません</div>`;
    return;
  }

  box.innerHTML = data.map(m => {
    const reactions = m.reactions || {};
    const isStreak = m.message_type === 'streak';

    return `
      <div class="chat-msg ${m.user_id === userId ? 'mine' : 'other'}">
        <div class="msg-name">${m.display_name || 'ゲスト'}</div>
        <div class="msg-bubble">
          ${(m.message || '').replace(/\n/g, '<br>')}

          ${isStreak ? `
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
              <button class="chip-btn" onclick="reactToMessage('${m.id}','fire')">🔥 ${reactions.fire || 0}</button>
              <button class="chip-btn" onclick="reactToMessage('${m.id}','clap')">👏 ${reactions.clap || 0}</button>
              <button class="chip-btn" onclick="reactToMessage('${m.id}','heart')">❤️ ${reactions.heart || 0}</button>
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }).join('');

  box.scrollTop = box.scrollHeight;
}

  }

  const inp = document.getElementById('chatInp');
  const box = document.getElementById('chatBox');

  if (!inp) return;

  const txt = inp.value.trim();

  if (!txt) {
    toast('コメントを入力してください');
    return;
  }

  inp.disabled = true;

  const { error } = await db
    .from('chat_messages')
    .insert({
      group_id: currentGroupId,
      user_id: userId,
      display_name: displayName || 'ゲスト',
      message: txt
    });

  inp.disabled = false;

  if (error) {
    console.error(error);
    toast('コメント送信に失敗しました');

    if (box) {
      box.innerHTML += `
        <div class="feed-empty">
          送信エラー：${error.message}
        </div>
      `;
    }

    return;
  }

  inp.value = '';

  toast('コメントを送信しました');

  await loadChat();
}

async function reactToMessage(messageId, type) {
  const { data, error } = await db
    .from('chat_messages')
    .select('reactions')
    .eq('id', messageId)
    .single();

  if (error) {
    toast('リアクション取得に失敗しました');
    return;
  }

  const reactions = data.reactions || {};
  reactions[type] = (reactions[type] || 0) + 1;

  const { error: updateError } = await db
    .from('chat_messages')
    .update({ reactions })
    .eq('id', messageId);

  if (updateError) {
    toast('リアクションに失敗しました');
    return;
  }

  await loadChat();
}

async function shareStreakToGroup() {
  const strkText = document.getElementById('streakNum')?.textContent || '0日';
  const streak = parseInt(strkText);

  if (!streak || streak <= 0) return;

  // 5日ごとのみ共有
  if (streak % 5 !== 0) return;

  // 同じ日数の重複投稿防止
  const lastShared = localStorage.getItem('lastSharedStreakAllGroups');
  if (String(lastShared) === String(streak)) return;

  if (!myGroups || myGroups.length === 0) return;

  for (const grp of myGroups) {
    await db.from('chat_messages').insert({
      group_id: grp.id,
      user_id: userId,
      display_name: displayName || 'ゲスト',
      message: `🔥 ${displayName || 'ゲスト'}さんが${streak}日継続を達成しました！みんなで応援しましょう🎉`,
      message_type: 'streak',
      streak_days: streak,
      reactions: {
        fire: 0,
        clap: 0,
        heart: 0
      }
    });
  }

  localStorage.setItem('lastSharedStreakAllGroups', streak);
  toast(`${streak}日継続を全グループに共有しました`);
}

// --- AI目標プラン提案 ---
async function getAIPlan() {
  const goal = document.getElementById("goalInp").value;

  if (!goal) {
    toast("目標を入力してください");
    return;
  }

  const btn = document.getElementById("aiBtn");
  const result = document.getElementById("aiPlanResult");

  btn.textContent = "AIが考え中...";
  btn.disabled = true;
  result.innerHTML = "";

  try {
    const res = await fetch("/api/gemini", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ goal })
    });

    const data = await res.json();

    if (!res.ok) {
      result.innerHTML =
        `<div class="ai-plan">エラー: ${data.error}</div>`;
      return;
    }

    result.innerHTML =
      `<div class="ai-plan">${data.plan}</div>`;

  } catch (e) {
    result.innerHTML =
      `<div class="ai-plan">通信エラー: ${e.message}</div>`;
  }

  btn.textContent = "AIにプランを提案してもらう";
  btn.disabled = false;
}

let mixedChart;

// Supabaseの記録からグラフ用データを作る
async function getGraphData() {
  if (!db) {
    return { labels: [], bodyWeight: [], strength: [], walk: [] };
  }

 const [sRes, wRes, bRes] = await Promise.all([
  db.from('strength_logs').select('*').eq('user_id', userId).order('logged_at', { ascending: true }),
  db.from('walk_logs').select('*').eq('user_id', userId).order('logged_at', { ascending: true }),
  db.from('body_logs').select('*').eq('user_id', userId).order('logged_at', { ascending: true })
]);

  const byDate = {};

  (bRes.data || []).forEach(r => {
  if (!r.logged_at) return;

  const date = r.logged_at.split('T')[0];
  const bw = Number(r.weight_kg) || null;

  if (!byDate[date]) byDate[date] = { strength: 0, walk: 0, bodyWeight: null };
  byDate[date].bodyWeight = bw;
});

  (sRes.data || []).forEach(r => {
    if (!r.logged_at) return;

    const date = r.logged_at.split('T')[0];
    const weight = Number(r.weight_kg) || 0;
    const reps = Number(r.reps) || 0;
    const sets = Number(r.sets) || 1;

  // 運動量 = 重量 × 回数 × セット数
    const volume = weight * reps * sets;

 　 if (!byDate[date]) byDate[date] = { strength: 0, walk: 0, bodyWeight: null };
    byDate[date].strength += volume;
  });

  (wRes.data || []).forEach(r => {
    if (!r.logged_at) return;

    const date = r.logged_at.split('T')[0];
    const dist = Number(r.distance_km) || 0;

    if (!byDate[date]) byDate[date] = { strength: 0, walk: 0, bodyWeight: null };
    byDate[date].walk += dist;
  });

  const dates = Object.keys(byDate).sort();

  return {
    labels: dates.map(d => {
      const parts = d.split('-');
      return `${Number(parts[1])}/${Number(parts[2])}`;
    }),
    bodyWeight: dates.map(d => byDate[d].bodyWeight),
    strength: dates.map(d => Math.round(byDate[d].strength || 0)),
    walk: dates.map(d => Math.round((byDate[d].walk || 0) * 10) / 10)
  };
}

// グラフの初期化
async function initChart() {
  const canvas = document.getElementById('mixedChart');
  if (!canvas || !window.Chart) return;

  canvas.parentElement.style.height = '260px';

  const ctx = canvas.getContext('2d');
  const graph = await getGraphData();

  mixedChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: graph.labels,
      datasets: [
        {
          label: '体重(kg)',
          data: graph.bodyWeight,
          borderColor: '#C62828',
          backgroundColor: 'rgba(198,40,40,0.12)',
          tension: 0.3,
          spanGaps: true,
          yAxisID: 'y'
        },
        {
          label: '筋トレ量',
          data: graph.strength,
          borderColor: '#2A7A3B',
          backgroundColor: 'rgba(42,122,59,0.12)',
          tension: 0.3,
          spanGaps: true,
          yAxisID: 'y1'
        },
        {
          label: 'ウォーキング(km)',
          data: graph.walk,
          backgroundColor: 'rgba(42,122,59,0.2)',
          borderColor: '#2A7A3B',
          borderWidth: 1,
          type: 'bar',
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      scales: {
        y: {
          type: 'linear',
          position: 'left',
          title: { display: true, text: '体重 kg' }
        },
        y1: {
          type: 'linear',
          position: 'right',
          grid: { drawOnChartArea: false },
          title: { display: true, text: '筋トレ量 / km' }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}
  
// 記録を保存したあとにグラフを更新する
async function refreshChart() {
  if (!mixedChart) return;

  const graph = await getGraphData();

  mixedChart.data.labels = graph.labels;
  mixedChart.data.datasets[0].data = graph.bodyWeight;
  mixedChart.data.datasets[1].data = graph.strength;
  mixedChart.data.datasets[2].data = graph.walk;

  mixedChart.update();
}

// チェックボックスで表示・非表示を切り替える
function toggleDataset(index) {
  if (!mixedChart) return;

  const isVisible = mixedChart.isDatasetVisible(index);

  if (isVisible) {
    mixedChart.hide(index);
  } else {
    mixedChart.show(index);
  }
}

// データセットの表示・非表示切り替え（自律性のための機能）
function toggleDataset(index) {
  if (!mixedChart) return;

  const isVisible = mixedChart.isDatasetVisible(index);
  if (isVisible) {
    mixedChart.hide(index);
  } else {
    mixedChart.show(index);
  }
}
